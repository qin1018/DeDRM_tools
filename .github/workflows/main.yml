name: Build DeDRM Release

on:
  push:
    branches: [ master ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package
        run: python3 make_release.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: |
            DeDRM_tools_*.zip
            DeDRM_tools.zip

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DeDRM_tools_*.zip
            DeDRM_tools.zip
